services:
  - type: web
    name: ghostwriter-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: gemma2-9b-it
      - key: OLLAMA_URL
        value: http://127.0.0.1:11434
      - key: OLLAMA_MODEL
        value: gemma3:1b
